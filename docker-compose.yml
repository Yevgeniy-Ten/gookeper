version: "3.8"

services:
    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=postgres
            - DB_NAME=gokeeper
            - DB_SSL_MODE=disable
            - JWT_SECRET=testtest
            - SECRET_AES_KEY=12345678901234567890123456789012
        depends_on:
            - postgres
        networks:
            - gokeeper-network

    postgres:
        image: postgres:17-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=gokeeper
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - gokeeper-network

    client:
        build:
            context: ./client
        ports:
            - "5173:5173"
        working_dir: /app
        command: ["npm", "run", "dev", "--", "--host"]
        depends_on:
            - app
        networks:
            - gokeeper-network

volumes:
    postgres_data:

networks:
    gokeeper-network:
        driver: bridge
